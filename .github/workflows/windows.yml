name: Windows

# The only workflow that gates this fork's product. The macOS workflow (build.yml) is inherited from
# upstream and deliberately left untouched: Sources/ is a read-only reference implementation.
#
# No `paths:` filter on pull_request on purpose — a required status check that never runs blocks every
# merge, so the cheap path filter would be a footgun the day branch protection requires this job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rust comes from rust-toolchain.toml; the action installs exactly that channel.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # `tauri::generate_context!` embeds frontendDist at compile time, so the UI is built first.
      # `npm run build` also runs svelte-check, so this step is the type-check gate too.
      - name: Build frontend (svelte-check + vite)
        run: npm run build

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Guard - adb is spawned only in crates/adbkit
        shell: pwsh
        run: |
          $hits = Select-String -Path (Get-ChildItem -Recurse -Include *.rs src-tauri, src |
            ForEach-Object FullName) -Pattern 'Command::new' -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::$($_.Line.Trim())" }
            throw "Process spawning outside crates/adbkit is forbidden (AGENTS.md invariant #1)."
          }
          Write-Host "No Command::new outside crates/adbkit."

      - name: Guard - offline-first (no remote assets in the UI)
        shell: pwsh
        run: |
          # The app must work with the network disabled: icons are a locally bundled font, nothing is
          # fetched at runtime (ADR-0009). The only permitted absolute URLs are the documentation links,
          # which are handed to the system browser and never loaded by the webview.
          # `src/` only: node_modules is never inside it, so no exclusion regex is needed.
          $files = @(Get-ChildItem -Recurse -Include *.svelte, *.css, *.ts, *.html -Path src |
            ForEach-Object FullName) + (Resolve-Path index.html).Path
          $bad = Select-String -Path $files -Pattern 'https?://(?!developer\.android\.com)[^\s"'')]+' -ErrorAction SilentlyContinue
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::$($_.Line.Trim())" }
            throw "Remote asset URL in UI source (the app must be offline-first)."
          }
          Write-Host "No remote assets in the UI source."

      - name: Guard - no Tauri v1 APIs
        shell: pwsh
        run: |
          # v1 surface: `tauri::api::*` in Rust, and the top-level "allowlist" config key. The bare word
          # "allowlist" is a normal English word used in this codebase (URL allowlists in commands.rs), so
          # matching it unquoted in Rust would only produce false positives.
          $failed = @()

          $rust = Get-ChildItem -Recurse -Include *.rs src-tauri, src, crates |
            Where-Object { $_.FullName -notlike '*\target\*' }
          $api = $rust | Select-String -Pattern 'tauri::api::' -ErrorAction SilentlyContinue
          foreach ($hit in $api) { $failed += "$($hit.Path):$($hit.LineNumber) tauri::api:: (v2 lives in tauri::* only)" }

          $configs = Get-ChildItem -Recurse -Include *.json, *.toml, *.yaml, *.yml src-tauri, src, crates |
            Where-Object { $_.FullName -notlike '*\target\*' -and $_.FullName -notlike '*\gen\*' -and $_.FullName -notlike '*node_modules*' }
          $key = $configs | Select-String -Pattern '"allowlist"\s*:' -ErrorAction SilentlyContinue
          foreach ($hit in $key) { $failed += ('{0}:{1} "allowlist" config key (v1)' -f $hit.Path, $hit.LineNumber) }

          $conf = 'src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            $root = Get-Content $conf -Raw | ConvertFrom-Json
            if ($root.PSObject.Properties.Name -contains 'tauri') {
              $failed += ('{0} top-level "tauri" key (v1 layout)' -f $conf)
            }
          }

          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Host "::error::$_" }
            throw "Tauri v1 API or config detected."
          }
          Write-Host "No Tauri v1 APIs or v1 config keys."

      - name: Package (NSIS installer)
        run: npm run tauri build

      - name: Installer summary
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB, 2)
          "**Installer**: ``$($exe.Name)`` — $mb MiB" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "**App**: ``target/release/android-panel.exe``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-panel-nsis-${{ github.sha }}
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14