[package]
name = "android-panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Android Panel — device list and adb server control for Windows"
publish = false

[lib]
name = "android_panel_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
adbkit = { path = "../crates/adbkit" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
